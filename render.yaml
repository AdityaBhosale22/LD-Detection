# Render Blueprint for the Django API (free tier).
# Render builds the same Dockerfile used locally and by Jenkins.
# Database: a free Neon PostgreSQL database; paste its connection string as DATABASE_URL.
services:
  - type: web
    name: ld-detection-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        sync: false   # Neon connection string, set in the Render dashboard
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # your Vercel URL, e.g. https://ld-detection.vercel.app
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_REPORTS_BUCKET
        sync: false   # optional
      - key: AWS_ACCESS_KEY_ID
        sync: false   # optional, IAM user limited to s3:PutObject on the bucket
      - key: AWS_SECRET_ACCESS_KEY
        sync: false   # optional
