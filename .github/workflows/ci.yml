name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lddiag
          POSTGRES_USER: lddiag
          POSTGRES_PASSWORD: lddiag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lddiag"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-secret
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: lddiag
      DB_USER: lddiag
      DB_PASSWORD: lddiag
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train baseline model
        run: python ml/build_baseline.py
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test tests

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz/ && exit 0
            sleep 2
          done
          docker compose logs web
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
