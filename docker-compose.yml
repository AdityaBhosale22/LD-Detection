# Local stack: Django (gunicorn) + PostgreSQL
#   docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lddiag
      POSTGRES_USER: lddiag
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lddiag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lddiag -d lddiag"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: ${IMAGE:-ld-detection:local}
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: lddiag
      DB_USER: lddiag
      DB_PASSWORD: ${DB_PASSWORD:-lddiag}
      DB_HOST: db
      DB_PORT: "5432"
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_REPORTS_BUCKET: ${AWS_S3_REPORTS_BUCKET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
